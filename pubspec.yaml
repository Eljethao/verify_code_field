name: verify_code_field
description: >-
  Clean, responsive verification code (OTP) field with any number of boxes,
  easy delete and paste, and SMS code auto-fill on Android and iOS.
version: 0.1.1
repository: https://github.com/Eljethao/verify_code_field
issue_tracker: https://github.com/Eljethao/verify_code_field/issues
screenshots:
  - description: The same verification screen in light and dark mode.
    path: screenshots/themes.webp
  - description: Typing a 6-digit code; the boxes fill one by one, then the code is verified.
    path: screenshots/demo.webp
  - description: The three box shapes, outlined, filled and underline.
    path: screenshots/styles.webp
  - description: A wrong code message, a hidden code, 4 boxes, and 8 boxes on a small phone.
    path: screenshots/states.webp
topics:
  - otp
  - pin-code
  - verification-code
  - sms
  - autofill

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.eljethao.verify_code_field
        pluginClass: VerifyCodeFieldPlugin
      ios:
        dartPluginClass: VerifyCodeFieldNoSms
        dartFileName: src/no_sms_plugin.dart
      macos:
        dartPluginClass: VerifyCodeFieldNoSms
        dartFileName: src/no_sms_plugin.dart
      windows:
        dartPluginClass: VerifyCodeFieldNoSms
        dartFileName: src/no_sms_plugin.dart
      linux:
        dartPluginClass: VerifyCodeFieldNoSms
        dartFileName: src/no_sms_plugin.dart
      web:
        pluginClass: VerifyCodeFieldNoSms
        fileName: src/no_sms_plugin.dart
